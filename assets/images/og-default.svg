<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background: Warm Cream -->
  <rect width="1200" height="630" fill="#F7F4ED"/>
  
  <!-- Decorative blocks in lower right -->
  <g opacity="0.85">
    <rect x="900" y="430" width="100" height="100" rx="12" fill="#F4BE52"/>
    <rect x="1010" y="430" width="100" height="100" rx="12" fill="#F68B74"/>
    <rect x="900" y="320" width="100" height="100" rx="12" fill="#8CCFC4"/>
    <rect x="1010" y="320" width="100" height="100" rx="12" fill="#9C87C8"/>
    <rect x="955" y="210" width="100" height="100" rx="12" fill="#123B68"/>
  </g>
  
  <!-- Five-quadrant B logo on the left -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="60" height="60" rx="9" fill="#123B68"/>
    <rect x="66" y="0" width="90" height="60" rx="9" fill="#F4BE52"/>
    <rect x="0" y="66" width="60" height="60" rx="9" fill="#123B68"/>
    <rect x="66" y="66" width="90" height="60" rx="9" fill="#F68B74"/>
    <rect x="0" y="132" width="60" height="60" rx="9" fill="#8CCFC4"/>
    <rect x="66" y="132" width="60" height="60" rx="9" fill="#9C87C8"/>
  </g>
  
  <!-- Wordmark -->
  <text x="80" y="340" font-family="Nunito, sans-serif" font-weight="700" font-size="84" fill="#123B68" letter-spacing="-2">blocks<tspan fill="#8CCFC4">.</tspan>expert</text>
  
  <!-- Tagline -->
  <text x="80" y="410" font-family="Inter, sans-serif" font-weight="500" font-size="34" fill="#1E2A36">Structured Creativity for Every Mind.</text>
  
  <!-- Sub-tagline -->
  <text x="80" y="470" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#1E2A36" opacity="0.75">Mindful building. Smart organization.</text>
  <text x="80" y="505" font-family="Inter, sans-serif" font-weight="400" font-size="24" fill="#1E2A36" opacity="0.75">Tools that help every mind thrive.</text>
  
  <!-- Five-mode pills at bottom -->
  <g transform="translate(80, 555)">
    <g>
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#F68B74"/>
      <text x="46" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF" text-anchor="middle">PLAY</text>
    </g>
    <g transform="translate(102, 0)">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#F4BE52"/>
      <text x="46" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#123B68" text-anchor="middle">LEARN</text>
    </g>
    <g transform="translate(204, 0)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#8CCFC4"/>
      <text x="60" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#123B68" text-anchor="middle">ORGANIZE</text>
    </g>
    <g transform="translate(334, 0)">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#9C87C8"/>
      <text x="46" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#FFFFFF" text-anchor="middle">FOCUS</text>
    </g>
    <g transform="translate(436, 0)">
      <rect x="0" y="0" width="92" height="36" rx="18" fill="#8CCFC4"/>
      <text x="46" y="24" font-family="Inter, sans-serif" font-weight="600" font-size="15" fill="#123B68" text-anchor="middle">GROW</text>
    </g>
  </g>
</svg>
